<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Image Bounding Box Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .image-viewer {
            position: relative; /* Crucial for positioning canvas AND popup over image */
            display: inline-block; /* To make container wrap image's width */
            max-width: 90%; /* Limit viewer width for responsiveness */
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            line-height: 0; /* Remove extra space below image */
        }
        .text_data {
            margin-left: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 35%;
        }
        #mainImage {
            max-width: 100%;
            height: auto; /* Maintain aspect ratio */
            display: block; /* Remove default inline spacing */
            border-radius: 4px;
        }
        #bboxCanvas {
            position: absolute;
            top: 10px; /* Adjust for padding of .image-viewer */
            left: 10px; /* Adjust for padding of .image-viewer */
            z-index: 10;
            /* pointer-events: none; REMOVED to allow mouse events on canvas */
            cursor: crosshair; /* Indicate interactivity */
        }

        /* Styling for the popup box */
        #bboxPopup {
            position: absolute; /* Position relative to .image-viewer */
            display: none; /* Hidden by default */
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
            color: white; /* Default text color */
            background-color: rgba(0, 0, 0, 0.75); /* Default background */
            z-index: 100; /* Ensure it's on top of everything */
            white-space: nowrap; /* Prevent text wrapping */
            transform: translateX(-50%); /* Center horizontally above mouse/box */
            pointer-events: none; /* Popup itself shouldn't block mouse events */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <h1>Annotated Image Viewer</h1>
    <h2>Viewing Image: {{src_img}}</h2>

    <div style="display: flex; justify-content: center; align-items: start;">
        <div class="image-viewer">
            <!-- Jinja2 will inject the image path here -->
            <img id="mainImage" src="{{ src_img }}" alt="Annotated Image">
            <canvas id="bboxCanvas"></canvas>
            <div id="bboxPopup"></div> <!-- The popup box for labels -->
        </div>
        <div class="text_data">
            <h3>Extracted Text Items:</h3>    
            <ul>
                {% for text in text_items %}
                    <li><strong>{{ text.name }}:</strong> {{ text.text }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
    

    <script>
        // --- CONFIGURATION ---
        const imagePath = '{{ src_img }}'; 
        const boundingBoxes = JSON.parse(`{{ bounding_boxes | safe }}`);
        // --- END CONFIGURATION ---


        const img = document.getElementById('mainImage');
        const canvas = document.getElementById('bboxCanvas');
        const ctx = canvas.getContext('2d');
        const imageViewerDiv = document.querySelector('.image-viewer');
        const bboxPopup = document.getElementById('bboxPopup');

        // To track which box is currently hovered
        let currentHoveredBox = null; 
        let mouseXOffset = 0; // To account for .image-viewer's left padding
        let mouseYOffset = 0; // To account for .image-viewer's top padding

        // Set the image source
        img.src = imagePath;

        const drawBoundingBoxes = () => {
            if (!img.complete || img.naturalWidth === 0) {
                console.warn("Image not fully loaded or has no natural dimensions.");
                return;
            }

            const renderedWidth = img.offsetWidth;
            const renderedHeight = img.offsetHeight;
            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;

            canvas.width = renderedWidth;
            canvas.height = renderedHeight;

            // Update offsets based on current padding
            mouseXOffset = parseFloat(getComputedStyle(imageViewerDiv).paddingLeft);
            mouseYOffset = parseFloat(getComputedStyle(imageViewerDiv).paddingTop);
            canvas.style.left = `${mouseXOffset}px`;
            canvas.style.top = `${mouseYOffset}px`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const scaleX = renderedWidth / naturalWidth;
            const scaleY = renderedHeight / naturalHeight;

            boundingBoxes.forEach(bbox => {
                const absWidth = bbox.width_relative * naturalWidth;
                const absHeight = bbox.height_relative * naturalHeight;
                const absX_topLeft = (bbox.x_center * naturalWidth) - (absWidth / 2);
                const absY_topLeft = (bbox.y_center * naturalHeight) - (absHeight / 2);

                const scaledX = absX_topLeft * scaleX;
                const scaledY = absY_topLeft * scaleY;
                const scaledWidth = absWidth * scaleX;
                const scaledHeight = absHeight * scaleY;

                // Store scaled coordinates directly on the bbox object for hover detection
                bbox._scaledX = scaledX;
                bbox._scaledY = scaledY;
                bbox._scaledWidth = scaledWidth;
                bbox._scaledHeight = scaledHeight;

                // Draw the rectangle (no label drawing here)
                ctx.strokeStyle = '#FF00FF';
                ctx.lineWidth = 2;
                ctx.strokeRect(scaledX, scaledY, scaledWidth, scaledHeight);
            });
        };

        // --- Event Listeners for Hover Popup ---
        canvas.addEventListener('mousemove', (event) => {
            // Mouse coordinates relative to the canvas itself
            const mouseX = event.offsetX; 
            const mouseY = event.offsetY;

            let hoveredThisFrame = null;

            for (const bbox of boundingBoxes) {
                // Check if mouse is within this bounding box (using stored scaled coordinates)
                if (mouseX >= bbox._scaledX && mouseX <= bbox._scaledX + bbox._scaledWidth &&
                    mouseY >= bbox._scaledY && mouseY <= bbox._scaledY + bbox._scaledHeight) {
                    hoveredThisFrame = bbox;
                    // Found the first box, stop checking
                }
            }

            if (hoveredThisFrame && hoveredThisFrame.label) {
                if (hoveredThisFrame !== currentHoveredBox) { // New box hovered
                    currentHoveredBox = hoveredThisFrame;
                    bboxPopup.textContent = currentHoveredBox.label;
                    bboxPopup.style.padding = "1em";
                    bboxPopup.style.backgroundColor = currentHoveredBox.label_background_color || currentHoveredBox.color || 'rgba(255, 99, 71, 0.75)';
                    bboxPopup.style.color = currentHoveredBox.textColor || 'white';
                    bboxPopup.style.display = 'block';

                    // Position the popup relative to the hovered bounding box
                    // Adjust for the parent (.image-viewer) padding by adding mouseXOffset/mouseYOffset
                    bboxPopup.style.left = `${hoveredThisFrame._scaledX + mouseXOffset}px`;
                    bboxPopup.style.top = `${hoveredThisFrame._scaledY + mouseYOffset - bboxPopup.offsetHeight - 5}px`; // 5px above the box
                }
            } else { // No box hovered or current box has no label
                if (currentHoveredBox) { // Mouse just moved off a box
                    currentHoveredBox = null;
                    bboxPopup.style.display = 'none';
                }
            }
        });

        canvas.addEventListener('mouseleave', () => {
            currentHoveredBox = null;
            bboxPopup.style.display = 'none';
        });

        // --- Initial Load and Resizing ---
        img.onload = drawBoundingBoxes;
        window.addEventListener('resize', drawBoundingBoxes);

        // In case the image is already loaded from cache when the script runs
        if (img.complete && img.naturalWidth > 0) {
            drawBoundingBoxes();
        }
    </script>
</body>
</html>
