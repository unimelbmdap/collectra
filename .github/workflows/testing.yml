
name: testing

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Remove unused packages
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/swift
    - name: Free disk space
      run: |
          df -h
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v2
    - name: Check core installation without ML backends
      run: |
        uv sync --locked --python ${{ matrix.python-version }} --group dev
        uv run --locked --python ${{ matrix.python-version }} python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('torch', 'torchvision', 'timm', 'rfdetr', 'transformers', 'ultralytics', 'drawyolo', 'ensemble_boxes', 'numba', 'llvmlite'))"
        uv run --locked --python ${{ matrix.python-version }} pytest tests/unit/test_optional_ml.py tests/unit/test_optional_yolo.py tests/unit/test_line_detector_rlsa.py
    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: uv sync --python ${{ matrix.python-version }} --group dev --extra ml --extra yolo
    - name: Run Tests
      run: uv run --extra ml --extra yolo --python ${{ matrix.python-version }} pytest
