
name: testing

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # 3.15 is informational until its dependencies publish 3.15 wheels
    # (ormsgpack, uuid-utils, torch, ...).
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v7
    - name: Remove unused packages
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/swift
    - name: Free disk space
      run: |
          df -h
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v2
    - name: Check core installation without ML backends
      run: |
        uv sync --locked --python ${{ matrix.python-version }} --group dev
        uv run --locked --python ${{ matrix.python-version }} python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('torch', 'torchvision', 'timm', 'rfdetr', 'transformers', 'ultralytics', 'drawyolo', 'ensemble_boxes', 'numba', 'llvmlite', 'llmloader'))"
        uv run --locked --python ${{ matrix.python-version }} pytest tests/unit/test_optional_ml.py tests/unit/test_optional_yolo.py tests/unit/test_line_detector_rlsa.py
    - name: Check built wheel outside the checkout
      # Validate the distributable outside the checkout before installing ML extras.
      run: |
        uv build --wheel --out-dir dist
        uv run --locked --python ${{ matrix.python-version }} python tests/packaging/check_wheel.py dist/*.whl
    # torch (and so the ML extras) has no Python 3.15 wheels yet, so 3.15 only
    # runs the core checks above.
    - name: Install ML dependencies for Python ${{ matrix.python-version }}
      if: matrix.python-version != '3.15'
      run: uv sync --python ${{ matrix.python-version }} --group dev --extra ml --extra yolo
    - name: Run Tests
      if: matrix.python-version != '3.15'
      run: uv run --extra ml --extra yolo --python ${{ matrix.python-version }} pytest
