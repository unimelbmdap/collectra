collectra_pipeline_metadata:
  name: CollectraPipeline
  version: 0.1.0
  ext: arb
  description: pipeline configuration

bar_img1:
  type: collectra.Image
  data: bar1.jpg

markdown_example1:
  type: collectra.Text
  data: page00076-markdown.md

object_detector:
  type: collectra.ObjectDetectionYOLO
  model: yolo11n.pt
  input: 
  - bar_img1  
  epochs: 1
  output:
  - human
  - chair
  - table
  - car  
  
text-detector:
  type: collectra.ObjectDetectionYOLO
  model: yolo11n.pt
  input: 
  - human
  - chair
  output:
  - text

markdown_converter:
  type: collectra.LLM
  model: gpt-4.1-nano
  input:
    - markdown_example1
    - bar_img1    
  temperature: 0.8
  output: markdown
  output_filename: apparatus.md
  system: You are a helpful assistant that spots objects for me
  template: |
    I am identifying objects from an image
    Your task is to take the image and identify objects in it.
 
    Example: {markdown_example1}

    Here is the image: {bar_img1}
    Here is another image that may help: {car}
    
    See it again!: {bar_img1}

    Please output something like this {markdown_example1}.